name: Build & Release GameLoot App

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-app:
    name: Build Android APK & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: Validate Babel Compilation
        working-directory: ./mobile
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const babel = require('@babel/core');
            function walk(dir) {
              let files = [];
              fs.readdirSync(dir).forEach(f => {
                const p = path.join(dir, f);
                if (fs.statSync(p).isDirectory()) files = files.concat(walk(p));
                else if (f.endsWith('.js')) files.push(p);
              });
              return files;
            }
            const all = walk('src').concat(['App.js', 'index.js']);
            all.forEach(file => {
              babel.transformFileSync(file, { configFile: './babel.config.js' });
            });
            console.log('All JS files validated successfully with Babel!');
          "

      - name: Generate Native Android Project (Expo Prebuild)
        working-directory: ./mobile
        run: npx expo prebuild -p android --no-install

      - name: Build Android APK with Gradle
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Collect Output APK
        working-directory: ./mobile
        run: |
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          TARGET_APK=${RELEASE_APK:-$DEBUG_APK}
          if [ -z "$TARGET_APK" ]; then
            echo "Error: No APK file was generated in android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK at: $TARGET_APK"
          cp "$TARGET_APK" ./GameLoot.apk
          ls -lh ./GameLoot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLoot-apk
          path: mobile/GameLoot.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('GameLoot {0}', github.ref_name) || format('GameLoot v1.0.{0}', github.run_number) }}
          body: |
            ## GameLoot Mobile App

            Automated Android release build.

            - **Version Tag**: `${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}`
            - **Target API Host**: `https://gameloot.youplex.cc`
            - **Commit**: `${{ github.sha }}`

            ### Installation
            Download the attached **`GameLoot.apk`** below and install it directly on your Android phone or emulator.
          files: |
            mobile/GameLoot.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
